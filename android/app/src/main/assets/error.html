<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Wesu+</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #FBF7EE;
    color: #1c1917;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 24px;
    text-align: center;
  }
  .card { max-width: 320px; }
  .note {
    width: 72px; height: 72px; margin: 0 auto 20px;
    border-radius: 22px; background: #1c1917;
    display: flex; align-items: center; justify-content: center;
  }
  .note svg { width: 36px; height: 36px; fill: #FBF7EE; }
  h1 { font-size: 22px; margin-bottom: 8px; }
  p { font-size: 14px; color: #78716c; margin-bottom: 24px; line-height: 1.5; }
  button {
    background: #1c1917; color: #FBF7EE; border: 0; border-radius: 999px;
    padding: 12px 40px; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  button:active { opacity: 0.85; }
</style>
</head>
<body>
  <div class="card">
    <div class="note">
      <svg viewBox="0 0 24 24"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>
    </div>
    <h1>You're offline</h1>
    <p>Check your connection and try again. Your music will be right here.</p>
    <button id="retry" type="button">Try again</button>
  </div>
  <script>
    function retry() { window.location.href = "wesuapp://retry"; }
    document.getElementById("retry").addEventListener("click", retry);
    window.addEventListener("online", retry);
  </script>
</body>
</html>
